<app-header></app-header>

<main class="main">
    <!-- 
    - añadir una sección con la información de los servicios
    - mostrarla en un carrusel

        - WiFi gratuito
        - Piscina
        - Gimnasio
        - Desayuno
        - Parking
        - Lavandería
    -->

    <!-- añadir una sección como introducción para las habitaciones -->

    <!-- añadir una sección como introducción para los eventos -->

    <!-- 
    - añadir una sección con las promociones
    - mostrarla en un carrusel
    -->

    <section class="section section__hero">
        <!-- imagen fondo - hero -->
        <img src="https://images.pexels.com/photos/32106338/pexels-photo-32106338.jpeg?cs=srgb&dl=pexels-alinaskazka-32106338.jpg&fm=jpg"
            class="image section__hero-image" alt="Playa mediterránea">

        <!-- contenido: lema del negocio -->
        <article class="article article__motto">
            <div class="article__motto--wrapper">
                <h1>
                    <span class="text-h1">Despierta</span>
                    <span class="text-h1">frente al mar.</span>
                    <span class="text-h1">Vive sin prisa.</span>
                </h1>
                <span class="article__motto-brand text-subtitle-lg">Hotel Argyros</span>
            </div>
        </article>

        <!--contenido: reservas/ verificación de disponibilidad -->
        <article class="article article__booking">

            <!-- seleccion de fechas -->
            <!-- al pulsar el botón se abrirá un modal donde se elegirán las fechas -->
            <div class="article__booking-date">
                <button class="article__booking-button article__booking-date--button">
                    <!-- icono de calendario-->
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M19 19H5V8h14m-3-7v2H8V1H6v2H5c-1.11 0-2 .89-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-1V1m-1 11h-5v5h5z" />
                    </svg>

                    <span class="article__booking-label text-label">Check-in</span>
                </button>

                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M8.025 22L6.25 20.225L14.475 12L6.25 3.775L8.025 2l10 10z" />
                </svg>

                <button class="article__booking-button article__booking-date--button">
                    <!-- icono de calendario-->
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M19 19H5V8h14m-3-7v2H8V1H6v2H5c-1.11 0-2 .89-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-1V1m-1 11h-5v5h5z" />
                    </svg>

                    <span class="article__booking-label text-label">Check-out</span>
                </button>
            </div>

            <!-- 
                selección de habitación:

                al pulsar el botón se abrirá un modal donde se elegirá el tipo de habitación
                en cada habitación se mostrará el precio 
                y un botón para acceder al detalle de esta
            -->
            <button class="article__booking-button article__booking-room">
                <span class="article__booking-label text-label">Habitación</span>
            </button>

            <!-- selección de promoción -->
            <!-- al pulsar el botón se abrirá un modal donde el usuario deberá loguearse -->
            <!-- en caso de no encontrarse registrado, se debrá registrar -->
            <button class="article__booking-button article__booking-promo">
                <span class="article__booking-label text-label">Promoción</span>
            </button>

            <!-- botón de reserva -->
            <button class="article__booking-button article__booking-booking text-label">Reservar</button>
        </article>
    </section>

</main>

<app-footer></app-footer>
